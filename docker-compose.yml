services:
  postgres:
    build: .
    container_name: shelfhelp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelfhelp
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: shelfhelpdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: shelfhelp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
